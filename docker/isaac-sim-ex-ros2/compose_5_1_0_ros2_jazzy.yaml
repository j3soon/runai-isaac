services:
  isaac-sim-ex:
    image: j3soon/runai-isaac-sim-ex:5.1.0-ros2-jazzy
    pull_policy: always
    restart: unless-stopped
    # Allow XFCE's session D-Bus on AppArmor hosts such as Brev VM Mode.
    security_opt:
      - apparmor=unconfined
    # Don't use `network_mode: host` here, as cloud environments may cause issues and cause `ros2 topic list` to hang.
    ports:
      - "${SSH_PORT:-2222}:22"
      - "${VNC_PORT:-5900}:5900"
      - "${NOVNC_PORT:-6080}:6080"
      - "${CODE_SERVER_PORT:-8080}:8080"
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      # This binary-based image runs as root, so persist its actual home paths.
      - ~/docker/isaac-sim/cache/main:/root/.cache:rw
      - ~/docker/isaac-sim/cache/computecache:/root/.nv/ComputeCache:rw
      - ~/docker/isaac-sim/logs:/root/.nvidia-omniverse/logs:rw
      - ~/docker/isaac-sim/config:/root/.nvidia-omniverse/config:rw
      - ~/docker/isaac-sim/data:/root/.local/share/ov/data:rw
      - ~/docker/isaac-sim/pkg:/root/.local/share/ov/pkg:rw
      # Workspace
      - "${WORKSPACE_DIR:-../..}:/workspace"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
